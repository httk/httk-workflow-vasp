[workflow]
name = "vasp.calculation.static"
description = "a finished VASP static run found in a directory"

[workflow.recognize]
file = "recognize.py"
priority = 10
requires = ["OUTCAR", "POSCAR"]

[workflow.inputs.structure]
role = "initial_structure"
entry_type = "structures"

[workflow.outputs.total_energy]
entry_type = "records"
role = "total_energy"
ref = "https://schemas.httk.org/defs/v0.1/properties/core/total_energy"
description = "The final total energy."
product_of = "initial_structure"

[workflow.collect]
file = "collect.py"
